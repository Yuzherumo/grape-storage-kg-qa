name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Validate graph data (10 checks)
        run: python scripts/validate_data.py

      - name: Cypher generation drift check
        run: python scripts/gen_cypher.py --check

      - name: Offline test suite with coverage (no API key, no network)
        run: python -m pytest tests -q --cov=app --cov-report=term-missing

      - name: Generate eval report (offline mode)
        run: python scripts/eval_qa.py
