name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage pytest-cov

      - name: Lint (ruff)
        run: ruff check app scripts tests

      - name: Validate graph data (10 checks)
        run: python scripts/validate_data.py

      - name: Validate Cypher scripts (static)
        run: python scripts/validate_cypher.py

      - name: Cypher generation drift check
        run: python scripts/gen_cypher.py --check

      - name: Execute equivalent Cypher on embedded openCypher engine (Kùzu)
        shell: bash
        run: |
          set +e
          python scripts/verify_cypher_engine.py > kuzu.log 2>&1
          code=$?
          cat kuzu.log
          if [ $code -eq 0 ]; then
            exit 0
          fi
          if [ $code -eq 2 ]; then
            echo "::warning::Kùzu 在本环境不可用（缺少 wheel/依赖），跳过；本地已实跑验证"
            exit 0
          fi
          echo "::error::Kùzu 实跑失败，退出码 $code"
          tail -n 40 kuzu.log | while IFS= read -r line; do echo "::error file=scripts/verify_cypher_engine.py::$line"; done
          exit $code

      - name: Offline test suite with coverage (no API key, no network)
        run: python -m pytest tests -q --cov=app --cov-report=term-missing

      - name: Generate eval report (offline mode)
        run: python scripts/eval_qa.py
