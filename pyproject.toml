[project]
name = "grape-storage-kg-qa"
version = "1.4.1"
description = "鲜食葡萄储藏知识图谱 × DeepSeek 问答（农客松 2026 主赛道方向二）"
requires-python = ">=3.10"
dependencies = [
  "streamlit==1.67.0",
  "openai==3.57.0",
  "pandas==3.1.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
# 跑测试：pip install -e ".[dev]"
dev = ["pytest==9.2.0"]
# 可选：嵌入式 openCypher 引擎，仅 scripts/verify_cypher_engine.py 使用
kuzu = ["kuzu==0.11.3"]

[project.urls]
Repository = "https://github.com/Yuzherumo/grape-storage-kg-qa"
Demo = "https://yuzherumo-grape-storage-kg-qa.ms.show"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", ".tmp", ".pipcache", "pytest-cache-files-*", "__pycache__", "docs", "data", "graph", "app"]
markers = [
  "llm: 需要 DEEPSEEK_API_KEY 的联网用例（默认跳过）",
  "slow: 慢用例",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".venv", ".tmp", ".pipcache", "graph", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 长中文注释/表格字符串

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"app/ui.py" = ["E402"]

[tool.coverage.run]
source = ["app"]
omit = ["app/ui.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
